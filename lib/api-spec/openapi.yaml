openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MICM Manufacturing Maturity Assessment Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: companies
    description: Company management
  - name: users
    description: User management
  - name: assessments
    description: Assessment cycle management
  - name: scores
    description: Assessment scoring
  - name: criterion-notes
    description: Criterion-level notes and evidence comments
  - name: actions
    description: Improvement action tracking
  - name: invitations
    description: Invitation management
  - name: reports
    description: Reporting and analytics
  - name: targets
    description: Maturity target management
  - name: audit
    description: Audit log review

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Companies ──────────────────────────────────────────────────────────────

  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List all companies (Super Admin only)
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a new company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyBody"
      responses:
        "201":
          description: Created company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get a company by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: Not found
    patch:
      operationId: updateCompany
      tags: [companies]
      summary: Update a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyBody"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /companies/{id}/dashboard:
    get:
      operationId: getCompanyDashboard
      tags: [companies]
      summary: Get company dashboard summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDashboard"

  /companies/me:
    get:
      operationId: getMyCompany
      tags: [companies]
      summary: Get the current user's company
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  # ─── Users ───────────────────────────────────────────────────────────────────

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/role:
    get:
      operationId: getMyRole
      tags: [users]
      summary: Get the current user's role and company
      responses:
        "200":
          description: Role info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRole"

  /companies/{id}/users:
    get:
      operationId: listCompanyUsers
      tags: [users]
      summary: List users in a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── Invitations ─────────────────────────────────────────────────────────────

  /invitations:
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: List pending invitations
      parameters:
        - name: companyId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invite a user or company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationBody"
      responses:
        "201":
          description: Created invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"

  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept an invitation by token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationBody"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── Assessment Cycles ───────────────────────────────────────────────────────

  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List assessment cycles
      parameters:
        - name: companyId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of assessment cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentCycle"
    post:
      operationId: createAssessment
      tags: [assessments]
      summary: Create a new assessment cycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssessmentBody"
      responses:
        "201":
          description: Created assessment cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentCycle"

  /assessments/{id}:
    get:
      operationId: getAssessment
      tags: [assessments]
      summary: Get an assessment cycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentCycle"
    patch:
      operationId: updateAssessment
      tags: [assessments]
      summary: Update an assessment cycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssessmentBody"
      responses:
        "200":
          description: Updated assessment cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentCycle"

  /assessments/{id}/assign:
    post:
      operationId: assignAssessment
      tags: [assessments]
      summary: Assign users to an assessment cycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignAssessmentBody"
      responses:
        "200":
          description: Assigned users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentCycle"

  /assessments/{id}/results:
    get:
      operationId: getAssessmentResults
      tags: [assessments]
      summary: Get aggregated results for an assessment cycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment results with per-user and aggregate scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResults"

  # ─── Scores ──────────────────────────────────────────────────────────────────

  /scores:
    get:
      operationId: listScores
      tags: [scores]
      summary: Get scores for an assessment cycle (optionally by user)
      parameters:
        - name: assessmentId
          in: query
          required: true
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Score"
    post:
      operationId: submitScores
      tags: [scores]
      summary: Submit/upsert scores for an assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitScoresBody"
      responses:
        "200":
          description: Saved scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Score"

  /assessment-criterion-notes:
    get:
      operationId: listCriterionNotes
      tags: [criterion-notes]
      summary: List criterion notes for an assessment
      parameters:
        - name: assessmentId
          in: query
          required: true
          schema:
            type: integer
        - name: criterionId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Criterion notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CriterionNote"
    post:
      operationId: createCriterionNote
      tags: [criterion-notes]
      summary: Add a note or evidence comment to an assessment criterion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCriterionNoteBody"
      responses:
        "201":
          description: Created criterion note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriterionNote"

  /scores/radar:
    get:
      operationId: getRadarData
      tags: [scores]
      summary: Get radar/spider chart data for one or more users/cycles
      parameters:
        - name: assessmentId
          in: query
          required: true
          schema:
            type: integer
        - name: userIds
          in: query
          schema:
            type: ["string", "null"]
            description: Comma-separated user IDs for multi-user overlay
        - name: compareAssessmentIds
          in: query
          schema:
            type: ["string", "null"]
            description: Comma-separated assessment IDs for multi-cycle overlay
      responses:
        "200":
          description: Radar chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarData"

  /scores/progress:
    get:
      operationId: getProgressOverTime
      tags: [scores]
      summary: Get domain score progress across assessment cycles
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Progress data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressData"

  # ─── Domains / Questions ─────────────────────────────────────────────────────

  /domains:
    get:
      operationId: listDomains
      tags: [assessments]
      summary: List all maturity domains with categories and criteria
      responses:
        "200":
          description: All domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Domain"

  # ─── Actions ─────────────────────────────────────────────────────────────────

  /actions:
    get:
      operationId: listActions
      tags: [actions]
      summary: List improvement actions
      parameters:
        - name: companyId
          in: query
          schema:
            type: ["integer", "null"]
        - name: assignedUserId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Action"
    post:
      operationId: createAction
      tags: [actions]
      summary: Create an improvement action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActionBody"
      responses:
        "201":
          description: Created action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"

  /actions/{id}:
    get:
      operationId: getAction
      tags: [actions]
      summary: Get an action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
    patch:
      operationId: updateAction
      tags: [actions]
      summary: Update an action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActionBody"
      responses:
        "200":
          description: Updated action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
    delete:
      operationId: deleteAction
      tags: [actions]
      summary: Delete an action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /actions/summary:
    get:
      operationId: getActionsSummary
      tags: [actions]
      summary: Get action counts by status for a company
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Actions summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsSummary"

  # ─── Reports ─────────────────────────────────────────────────────────────────

  /reports/company/{id}:
    get:
      operationId: getCompanyReport
      tags: [reports]
      summary: Get full company assessment report data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: assessmentId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyReport"

  /reports/company/{id}/export:
    get:
      operationId: getCompanyReportExport
      tags: [reports]
      summary: Export company assessment report data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, pdf, xlsx]
            default: csv
        - name: template
          in: query
          required: false
          schema:
            type: string
            enum: [board_ready, operational_detail, executive_summary]
            default: board_ready
      responses:
        "200":
          description: Exported company report
          headers:
            Content-Disposition:
              description: Attachment filename for the generated export
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /reports/superadmin:
    get:
      operationId: getSuperAdminReport
      tags: [reports]
      summary: Cross-company aggregated report (Super Admin only)
      responses:
        "200":
          description: Super admin report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperAdminReport"

  /reports/cross-company-radar:
    get:
      operationId: getCrossCompanyRadar
      tags: [reports]
      summary: Cross-company maturity radar chart data (Super Admin only)
      parameters:
        - name: companyIds
          in: query
          required: true
          schema:
            type: string
            description: Comma-separated list of company IDs to compare
      responses:
        "200":
          description: Radar data with one series per selected company (latest completed assessment)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarData"

  /targets:
    get:
      operationId: listTargets
      tags: [targets]
      summary: List maturity targets for a company
      parameters:
        - name: companyId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of maturity targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaturityTarget"

  /targets/{companyId}/{domainId}:
    put:
      operationId: upsertTarget
      tags: [targets]
      summary: Create or update a maturity target for a domain
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: integer
        - name: domainId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMaturityTargetBody"
      responses:
        "200":
          description: Upserted maturity target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaturityTarget"

  /reports/programme:
    get:
      operationId: getProgrammeIntelligence
      tags: [reports]
      summary: Programme Intelligence Dashboard data (Super Admin only)
      responses:
        "200":
          description: Programme intelligence report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgrammeIntelligenceReport"

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries (Super Admin only)
      parameters:
        - name: companyId
          in: query
          required: false
          schema:
            type: integer
        - name: eventType
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checkedAt:
          type: string
        version:
          type: ["string", "null"]
        commit:
          type: ["string", "null"]
        database:
          type: object
          properties:
            status:
              type: string
              enum: [ok, degraded]
          required:
            - status
      required:
        - status
        - checkedAt
        - database

    AuditLog:
      type: object
      properties:
        id:
          type: integer
        actorUserId:
          type: ["integer", "null"]
        actorClerkUserId:
          type: ["string", "null"]
        actorRole:
          type: ["string", "null"]
        companyId:
          type: ["integer", "null"]
        eventType:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
      required:
        - id
        - eventType
        - targetType
        - targetId
        - metadata
        - createdAt

    # ─── Company ────────────────────────────────────────────────────────────────

    CompanyChallenge:
      type: string
      enum:
        - Cash flow pressure
        - Labour and skills shortages
        - Recruitment and retention
        - Rising material costs
        - Supply chain disruption
        - Production capacity constraints
        - Quality issues or rework
        - Delivery performance challenges
        - Equipment reliability and downtime
        - Lack of process standardisation
        - Limited management information or data visibility
        - Low digital maturity
        - Energy costs and sustainability pressure
        - Leadership bandwidth constraints
        - Growth planning and market uncertainty
        - Production under-utilisation
        - Poor forecast accuracy
        - Long lead times
        - High work-in-progress levels
        - Inefficient factory layout or material flow
        - Low sales pipeline visibility
        - Customer concentration risk
        - Difficulty funding capital investment
        - Weak supplier performance management
        - Limited continuous improvement capability

    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sector:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        currentStatusDescription:
          type: ["string", "null"]
        currentChallenges:
          type: array
          items:
            $ref: "#/components/schemas/CompanyChallenge"
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - currentChallenges
        - isActive
        - createdAt
        - updatedAt

    CreateCompanyBody:
      type: object
      properties:
        name:
          type: string
        sector:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        currentStatusDescription:
          type: ["string", "null"]
        currentChallenges:
          type: array
          items:
            $ref: "#/components/schemas/CompanyChallenge"
      required:
        - name

    UpdateCompanyBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        sector:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        currentStatusDescription:
          type: ["string", "null"]
        currentChallenges:
          type: array
          items:
            $ref: "#/components/schemas/CompanyChallenge"
        isActive:
          type: ["boolean", "null"]

    CompanyDashboard:
      type: object
      properties:
        companyId:
          type: integer
        totalUsers:
          type: integer
        totalAssessments:
          type: integer
        completedAssessments:
          type: integer
        activeActions:
          type: integer
        completedActions:
          type: integer
        latestCycleScore:
          type: ["number", "null"]
        domainSummaries:
          type: array
          items:
            $ref: "#/components/schemas/DomainSummary"
      required:
        - companyId
        - totalUsers
        - totalAssessments
        - completedAssessments
        - activeActions
        - completedActions
        - domainSummaries

    DomainSummary:
      type: object
      properties:
        domainId:
          type: integer
        domainName:
          type: string
        averageScore:
          type: ["number", "null"]
        band:
          type: ["string", "null"]
      required:
        - domainId
        - domainName

    # ─── User ────────────────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          type: string
          enum: [super_admin, company_admin, company_user]
        companyId:
          type: ["integer", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - clerkUserId
        - email
        - role
        - isActive
        - createdAt

    UserRole:
      type: object
      properties:
        userId:
          type: integer
        role:
          type: string
          enum: [super_admin, company_admin, company_user]
        companyId:
          type: ["integer", "null"]
        companyName:
          type: ["string", "null"]
      required:
        - userId
        - role

    UpdateUserBody:
      type: object
      properties:
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
        isActive:
          type: ["boolean", "null"]

    # ─── Invitation ──────────────────────────────────────────────────────────────

    Invitation:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum: [super_admin, company_admin, company_user]
        companyId:
          type: ["integer", "null"]
        token:
          type: string
        status:
          type: string
          enum: [pending, accepted, expired]
        createdAt:
          type: string
        expiresAt:
          type: string
      required:
        - id
        - email
        - role
        - token
        - status
        - createdAt
        - expiresAt

    CreateInvitationBody:
      type: object
      properties:
        email:
          type: string
        role:
          type: string
          enum: [super_admin, company_admin, company_user]
        companyId:
          type: ["integer", "null"]
      required:
        - email
        - role

    AcceptInvitationBody:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    # ─── Assessment Cycle ────────────────────────────────────────────────────────

    AssessmentCycle:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, active, completed]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        assignedUserIds:
          type: array
          items:
            type: integer
        completedUserIds:
          type: array
          items:
            type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - companyId
        - name
        - status
        - assignedUserIds
        - completedUserIds
        - createdAt
        - updatedAt

    CreateAssessmentBody:
      type: object
      properties:
        companyId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
      required:
        - companyId
        - name

    UpdateAssessmentBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]

    AssignAssessmentBody:
      type: object
      properties:
        userIds:
          type: array
          items:
            type: integer
      required:
        - userIds

    AssessmentResults:
      type: object
      properties:
        assessmentId:
          type: integer
        assessmentName:
          type: string
        userScores:
          type: array
          items:
            $ref: "#/components/schemas/UserScoreSet"
        aggregateScores:
          type: array
          items:
            $ref: "#/components/schemas/DomainScore"
        criterionNotes:
          type: array
          items:
            $ref: "#/components/schemas/CriterionNote"
      required:
        - assessmentId
        - assessmentName
        - userScores
        - aggregateScores
        - criterionNotes

    UserScoreSet:
      type: object
      properties:
        userId:
          type: integer
        userName:
          type: string
        domainScores:
          type: array
          items:
            $ref: "#/components/schemas/DomainScore"
        overallScore:
          type: ["number", "null"]
        completedAt:
          type: ["string", "null"]
      required:
        - userId
        - userName
        - domainScores

    DomainScore:
      type: object
      properties:
        domainId:
          type: integer
        domainName:
          type: string
        score:
          type: ["number", "null"]
        band:
          type: ["string", "null"]
      required:
        - domainId
        - domainName

    # ─── Score ───────────────────────────────────────────────────────────────────

    Score:
      type: object
      properties:
        id:
          type: integer
        assessmentId:
          type: integer
        userId:
          type: integer
        criterionId:
          type: integer
        score:
          type: integer
          minimum: 0
          maximum: 4
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - assessmentId
        - userId
        - criterionId
        - score
        - createdAt
        - updatedAt

    SubmitScoresBody:
      type: object
      properties:
        assessmentId:
          type: integer
        scores:
          type: array
          items:
            $ref: "#/components/schemas/ScoreInput"
      required:
        - assessmentId
        - scores

    ScoreInput:
      type: object
      properties:
        criterionId:
          type: integer
        score:
          type: integer
          minimum: 0
          maximum: 4
        notes:
          type: ["string", "null"]
      required:
        - criterionId
        - score

    CriterionNote:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        assessmentId:
          type: integer
        criterionId:
          type: integer
        authorUserId:
          type: integer
        authorName:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - assessmentId
        - criterionId
        - authorUserId
        - authorName
        - note
        - createdAt
        - updatedAt

    CreateCriterionNoteBody:
      type: object
      properties:
        assessmentId:
          type: integer
        criterionId:
          type: integer
        note:
          type: string
          minLength: 1
      required:
        - assessmentId
        - criterionId
        - note

    RadarData:
      type: object
      properties:
        domains:
          type: array
          items:
            type: string
        series:
          type: array
          items:
            $ref: "#/components/schemas/RadarSeries"
      required:
        - domains
        - series

    RadarSeries:
      type: object
      properties:
        label:
          type: string
        scores:
          type: array
          items:
            type: ["number", "null"]
        color:
          type: ["string", "null"]
      required:
        - label
        - scores

    ProgressData:
      type: object
      properties:
        cycles:
          type: array
          items:
            $ref: "#/components/schemas/CycleProgress"
      required:
        - cycles

    CycleProgress:
      type: object
      properties:
        assessmentId:
          type: integer
        assessmentName:
          type: string
        completedAt:
          type: ["string", "null"]
        domainScores:
          type: array
          items:
            $ref: "#/components/schemas/DomainScore"
        overallScore:
          type: ["number", "null"]
      required:
        - assessmentId
        - assessmentName
        - domainScores

    # ─── Domain / Criteria ───────────────────────────────────────────────────────

    Domain:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        orderIndex:
          type: integer
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
        - id
        - name
        - orderIndex
        - categories

    Category:
      type: object
      properties:
        id:
          type: integer
        domainId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        orderIndex:
          type: integer
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/Criterion"
      required:
        - id
        - domainId
        - name
        - orderIndex
        - criteria

    Criterion:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        baselineDescription:
          type: ["string", "null"]
        excellenceDescription:
          type: ["string", "null"]
        orderIndex:
          type: integer
      required:
        - id
        - categoryId
        - name
        - orderIndex

    # ─── Action ──────────────────────────────────────────────────────────────────

    Action:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        assessmentId:
          type: ["integer", "null"]
        domainId:
          type: ["integer", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [not_started, in_progress, completed, on_hold]
        priority:
          type: string
          enum: [low, medium, high]
        assignedUserId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
        completedDate:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - companyId
        - title
        - status
        - priority
        - createdAt
        - updatedAt

    CreateActionBody:
      type: object
      properties:
        companyId:
          type: integer
        assessmentId:
          type: ["integer", "null"]
        domainId:
          type: ["integer", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, medium, high]
        assignedUserId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
      required:
        - companyId
        - title
        - priority

    UpdateActionBody:
      type: object
      properties:
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        priority:
          type: ["string", "null"]
        assignedUserId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
        completedDate:
          type: ["string", "null"]

    ActionsSummary:
      type: object
      properties:
        companyId:
          type: integer
        notStarted:
          type: integer
        inProgress:
          type: integer
        completed:
          type: integer
        onHold:
          type: integer
        total:
          type: integer
      required:
        - companyId
        - notStarted
        - inProgress
        - completed
        - onHold
        - total

    # ─── Reports ─────────────────────────────────────────────────────────────────

    CompanyReport:
      type: object
      properties:
        company:
          $ref: "#/components/schemas/Company"
        assessmentCycles:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentCycle"
        latestResults:
          $ref: "#/components/schemas/AssessmentResults"
        progressData:
          $ref: "#/components/schemas/ProgressData"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        criterionNotes:
          type: array
          items:
            $ref: "#/components/schemas/CriterionNote"
      required:
        - company
        - assessmentCycles
        - progressData
        - actions
        - criterionNotes

    SuperAdminReport:
      type: object
      properties:
        totalCompanies:
          type: integer
        totalAssessments:
          type: integer
        totalUsers:
          type: integer
        companySummaries:
          type: array
          items:
            $ref: "#/components/schemas/CompanyReportSummary"
        companyInfo:
          type: array
          items:
            $ref: "#/components/schemas/CompanyInfoSummary"
        mostCommonChallenges:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeFrequency"
        companiesByChallenge:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeCompanyGroup"
      required:
        - totalCompanies
        - totalAssessments
        - totalUsers
        - companySummaries
        - companyInfo
        - mostCommonChallenges
        - companiesByChallenge

    CompanyReportSummary:
      type: object
      properties:
        companyId:
          type: integer
        companyName:
          type: string
        latestOverallScore:
          type: ["number", "null"]
        completedAssessments:
          type: integer
        activeActions:
          type: integer
        currentStatusDescription:
          type: ["string", "null"]
        currentChallenges:
          type: array
          items:
            $ref: "#/components/schemas/CompanyChallenge"
        challengeCount:
          type: integer
        domainScores:
          type: array
          items:
            $ref: "#/components/schemas/DomainScore"
      required:
        - companyId
        - companyName
        - completedAssessments
        - activeActions
        - currentChallenges
        - challengeCount
        - domainScores

    CompanyInfoSummary:
      type: object
      properties:
        companyId:
          type: integer
        companyName:
          type: string
        currentStatusDescription:
          type: ["string", "null"]
        currentChallenges:
          type: array
          items:
            $ref: "#/components/schemas/CompanyChallenge"
        challengeCount:
          type: integer
      required:
        - companyId
        - companyName
        - currentChallenges
        - challengeCount

    ChallengeFrequency:
      type: object
      properties:
        challenge:
          $ref: "#/components/schemas/CompanyChallenge"
        companyCount:
          type: integer
      required:
        - challenge
        - companyCount

    ChallengeCompanyGroup:
      type: object
      properties:
        challenge:
          $ref: "#/components/schemas/CompanyChallenge"
        companies:
          type: array
          items:
            $ref: "#/components/schemas/CompanyInfoSummary"
      required:
        - challenge
        - companies

    # ─── Targets ─────────────────────────────────────────────────────────────────

    MaturityTarget:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        domainId:
          type: integer
        domainName:
          type: string
        targetScore:
          type: number
        targetDate:
          type: ["string", "null"]
          format: date-time
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - domainId
        - domainName
        - targetScore
        - createdAt
        - updatedAt

    UpsertMaturityTargetBody:
      type: object
      properties:
        targetScore:
          type: number
          minimum: 0
          maximum: 4
        targetDate:
          type: ["string", "null"]
          format: date-time
        notes:
          type: ["string", "null"]
      required:
        - targetScore

    # ─── Programme Intelligence ────────────────────────────────────────────────

    ProgrammeKPIs:
      type: object
      properties:
        participatingCompanies:
          type: integer
        companiesWithCompletedAssessments:
          type: integer
        averageMaturity:
          type: ["number", "null"]
        actionCompletionRate:
          type: ["number", "null"]
        assessmentCompletionRate:
          type: ["number", "null"]
        weakestDomain:
          type: ["string", "null"]
        strongestDomain:
          type: ["string", "null"]
      required:
        - participatingCompanies
        - companiesWithCompletedAssessments

    CompanyHeatmapRow:
      type: object
      properties:
        companyId:
          type: integer
        companyName:
          type: string
        sector:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        latestCompletedAt:
          type: ["string", "null"]
          format: date-time
        overallScore:
          type: ["number", "null"]
        domainScores:
          type: array
          items:
            $ref: "#/components/schemas/DomainScore"
      required:
        - companyId
        - companyName
        - domainScores

    DomainBenchmark:
      type: object
      properties:
        domainId:
          type: integer
        domainName:
          type: string
        averageScore:
          type: ["number", "null"]
        minScore:
          type: ["number", "null"]
        maxScore:
          type: ["number", "null"]
        companiesScored:
          type: integer
      required:
        - domainId
        - domainName
        - companiesScored

    RiskCompany:
      type: object
      properties:
        companyId:
          type: integer
        companyName:
          type: string
        riskType:
          type: string
        detail:
          type: string
      required:
        - companyId
        - companyName
        - riskType
        - detail

    ProgrammeIntelligenceReport:
      type: object
      properties:
        kpis:
          $ref: "#/components/schemas/ProgrammeKPIs"
        heatmap:
          type: array
          items:
            $ref: "#/components/schemas/CompanyHeatmapRow"
        domainBenchmarks:
          type: array
          items:
            $ref: "#/components/schemas/DomainBenchmark"
        riskCompanies:
          type: array
          items:
            $ref: "#/components/schemas/RiskCompany"
        domains:
          type: array
          items:
            type: string
      required:
        - kpis
        - heatmap
        - domainBenchmarks
        - riskCompanies
        - domains
